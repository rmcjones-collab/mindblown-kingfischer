# CodeRabbit configuration for Kingfischer. Generated brain data, the shared renderer copy and vendored code are out of scope.
language: en-US
reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!**/*-data.js"              # generated by brains/build_brains.py
    - "!brains/*.html"             # generated from brains/page.template.html
    - "!brains/app.js"             # shared renderer, owned by the private mindblown repo, copied unchanged
    - "!brains/style.css"
    - "!vendor/**"                 # chess.js 1.4.0, unchanged (BSD-2-Clause)
    - "!bot/browser/vendor/**"     # stockfish.js, onnxruntime-web, unchanged
    - "!bot/browser/policy-index.js" # Lc0 policy map, data only
    - "!bot/browser/pieces/**"
    - "!package-lock.json"
  path_instructions:
    - path: "king/**"
      instructions: >
        The King Brain must be a pure function. Check the rule order against docs/KING-RULES.md, that no move the
        referee did not rate can win, that the safety margins are applied from the side to move's view, and that
        randomness is seeded.
    - path: "council/**"
      instructions: >
        Check UCI handling (bestmove/info parsing, mate scores, WDL, castling names from Lc0), time budgets, timeouts
        and that a failing voice cannot block the move.
    - path: "bot/lichess/**"
      instructions: >
        Check the Bot API use (streams, retries on 429, challenge decline reasons), that the token is never logged, and
        that chat input cannot change the mode after ply 2.
    - path: "bot/browser/**"
      instructions: >
        Check board input, promotion, take-back, escaping of strings put into innerHTML, keyboard access, and that the
        Maia encoder matches Lc0's classical 112-plane input.
    - path: "brains/build_brains.py"
      instructions: Every synapse must carry a real citation URL; no dangling links or duplicate ids.
    - path: "**/*.md"
      instructions: Check that stated counts, file names and commands match the code.
  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - "^review-base/.*$"
    auto_incremental_review: true
  tools:
    ruff:
      enabled: true
chat:
  auto_reply: true
